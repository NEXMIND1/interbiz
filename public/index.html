<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InterBiz · Inteligencia de Exportación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --surface:#ffffff; --surface-2:#f5f4f0;
  --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --muted-2:#a1a1aa;
  --border:#e4e4e7; --border-strong:#d4d4d8;
  --accent:#b45309; --accent-soft:#fef3c7; --accent-ink:#78350f;
  --success:#15803d; --success-soft:#dcfce7;
  --danger:#b91c1c; --danger-soft:#fee2e2;
  --info:#1d4ed8; --info-soft:#dbeafe;
  --radius:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,0.10);
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
a:hover{border-bottom-color:currentColor}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,83,9,0.10)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-0.01em;line-height:1.2}

.nav{position:sticky;top:0;z-index:50;background:rgba(250,249,246,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--serif)}
.brand-name{font-weight:600;font-size:15px}
.brand-tag{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;border-left:1px solid var(--border-strong);padding-left:12px;margin-left:6px}
.nav-links{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px}
.nav-link{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s}
.nav-link:hover{color:var(--ink)}
.nav-link.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.nav-right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.lang-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink)}
.lang-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}

.container{max-width:1140px;margin:0 auto;padding:0 32px}
main{padding-bottom:80px}
.view{display:none}
.view.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.hero{padding:80px 0 64px;border-bottom:1px solid var(--border)}
.hero-overline{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.hero-overline::before{content:"";width:24px;height:1px;background:var(--accent)}
.hero h1{font-size:clamp(36px,5vw,58px);max-width:820px;margin-bottom:24px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-lead{font-size:18px;color:var(--ink-2);max-width:620px;margin-bottom:40px;line-height:1.55}
.hero-stats{display:flex;gap:40px;margin-bottom:56px;flex-wrap:wrap}
.hero-stat b{display:block;font-family:var(--serif);font-size:32px;font-weight:500;color:var(--ink);line-height:1}
.hero-stat span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:6px}

.paths{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:56px 0}
.path-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;transition:all .2s;cursor:pointer;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.path-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.path-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.path-card:hover::after{transform:scaleX(1)}
.path-tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted)}
.path-title{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.2;margin-bottom:4px}
.path-desc{color:var(--ink-2);font-size:14px;flex:1}
.path-cta{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--accent);margin-top:8px}
.path-cta::after{content:"→";transition:transform .2s}
.path-card:hover .path-cta::after{transform:translateX(4px)}

.disclaimer{margin-top:32px;padding:20px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--muted);line-height:1.6}
.disclaimer b{color:var(--ink-2)}

.breadcrumb{display:flex;align-items:center;gap:8px;padding:24px 0 0;font-size:13px;color:var(--muted)}
.breadcrumb a{color:var(--muted);cursor:pointer}
.breadcrumb a:hover{color:var(--ink)}
.breadcrumb .sep{opacity:0.5}
.breadcrumb .current{color:var(--ink);font-weight:500}

.wizard{padding:40px 0 0}
.wizard-head{margin-bottom:32px}
.wizard-step{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.wizard-title{font-size:32px;margin-bottom:8px}
.wizard-sub{color:var(--muted);font-size:15px;max-width:600px}
.progress{display:flex;gap:6px;margin:24px 0 40px}
.progress-step{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;transition:background .3s}
.progress-step.active{background:var(--accent)}
.progress-step.done{background:var(--ink)}

.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px}
.option-card{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:22px;cursor:pointer;transition:all .15s;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative}
.option-card:hover{border-color:var(--ink-2);box-shadow:var(--shadow-md)}
.option-card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(180,83,9,0.10)}
.option-icon{font-size:26px;line-height:1}
.option-title{font-weight:600;font-size:15px;color:var(--ink)}
.option-desc{font-size:13px;color:var(--muted);line-height:1.5}
.option-check{position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;transition:all .15s}
.option-card.selected .option-check{background:var(--accent);border-color:var(--accent)}
.option-card.selected .option-check::after{content:"✓";color:#fff;font-size:11px;font-weight:700}

.field-group{margin-bottom:24px}
.field-label{display:block;font-weight:500;font-size:13px;margin-bottom:8px;color:var(--ink-2)}
.field-hint{font-size:12px;color:var(--muted);margin-top:6px}

.wizard-nav{display:flex;justify-content:space-between;align-items:center;padding-top:32px;border-top:1px solid var(--border);margin-top:32px;gap:12px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:500;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{background:#000}
.btn-primary:disabled{background:var(--border-strong);color:var(--muted);cursor:not-allowed}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink-2)}
.btn-ghost{color:var(--muted);padding:11px 12px}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:8px 14px;font-size:13px}

.result{padding:40px 0 0}
.result-head{margin-bottom:32px;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.result-headline{flex:1;min-width:280px}
.result-actions{display:flex;gap:8px;flex-wrap:wrap}

.destination-list{display:flex;flex-direction:column;gap:16px}
.dest-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .2s}
.dest-card:hover{box-shadow:var(--shadow-md)}
.dest-head{padding:24px 28px;display:flex;align-items:center;gap:16px;cursor:pointer;user-select:none;transition:background .15s}
.dest-head:hover{background:var(--surface-2)}
.dest-rank{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.dest-card:first-child .dest-rank{background:var(--accent);color:#fff}
.dest-flag{font-size:32px;line-height:1}
.dest-name{flex:1}
.dest-name h3{font-size:19px;font-weight:600;font-family:var(--sans);margin-bottom:2px}
.dest-name p{font-size:13px;color:var(--muted)}
.dest-score{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--ink)}
.dest-score span{font-size:12px;color:var(--muted);font-weight:400}
.dest-chevron{color:var(--muted-2);transition:transform .2s;font-size:14px}
.dest-card.open .dest-chevron{transform:rotate(180deg)}

.dest-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dest-card.open .dest-body{max-height:2000px}
.dest-content{padding:0 28px 28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dest-section h4{font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:10px;font-family:var(--mono);font-weight:500}
.dest-section p{font-size:14px;color:var(--ink-2);line-height:1.6}
.dest-section ul{list-style:none;padding:0}
.dest-section li{font-size:14px;color:var(--ink-2);padding-left:18px;position:relative;margin-bottom:8px;line-height:1.55}
.dest-section li::before{content:"·";position:absolute;left:4px;color:var(--accent);font-weight:700;font-size:18px;line-height:1}
.dest-meta{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:8px}
.dest-meta-item{padding:14px 16px;background:var(--surface)}
.dest-meta-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;font-family:var(--mono)}
.dest-meta-value{font-size:13px;font-weight:500;color:var(--ink)}
.dest-links{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:16px;border-top:1px solid var(--border)}
.dest-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--border);transition:all .15s}
.dest-link:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.sim-shell{padding:40px 0 0}
.sim-levels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.level-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:12px}
.level-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.level-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px;width:fit-content}
.level-title{font-size:22px;font-weight:600}
.level-desc{font-size:14px;color:var(--ink-2);flex:1;line-height:1.55}
.level-meta{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

.sim-stage{padding:40px 0 0}
.sim-header{margin-bottom:24px}
.sim-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:12px}
.sim-badge.live{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.step-pill{display:flex;gap:4px;margin-bottom:32px}
.step-pill .sp{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.step-pill .sp.done{background:var(--ink)}
.step-pill .sp.current{background:var(--accent)}

.scenario{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;margin-bottom:24px}
.scenario-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--danger);margin-bottom:12px}
.scenario-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--danger)}
.scenario h2{font-size:24px;font-weight:600;font-family:var(--sans);margin-bottom:10px;line-height:1.3}
.scenario p{color:var(--ink-2);font-size:15px;line-height:1.6;margin-bottom:20px}
.scenario-context{padding:14px 16px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:20px}

.coach{background:linear-gradient(135deg,#fef9e7,#fffdf5);border:1px solid #fde68a;border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;display:flex;gap:14px;align-items:flex-start}
.coach-icon{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0;font-size:16px}
.coach-text{font-size:14px;color:var(--ink-2);line-height:1.55}
.coach-text b{color:var(--ink);font-weight:600}

.decision-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.decision{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:18px 20px;text-align:left;cursor:pointer;transition:all .15s;display:flex;gap:14px;align-items:flex-start}
.decision:hover{border-color:var(--ink-2);box-shadow:var(--shadow-sm)}
.decision.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(180,83,9,0.08)}
.decision:disabled{cursor:default;opacity:0.7}
.decision-radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:3px;position:relative;transition:all .15s}
.decision.selected .decision-radio{border-color:var(--accent)}
.decision.selected .decision-radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.decision-text{flex:1}
.decision-title{font-weight:600;font-size:14px;margin-bottom:3px;color:var(--ink)}
.decision-desc{font-size:13px;color:var(--muted);line-height:1.5}

.feedback{padding:16px 18px;border-radius:var(--radius);margin-top:16px;font-size:14px;line-height:1.55}
.feedback.good{background:var(--success-soft);color:#14532d;border-left:3px solid var(--success)}
.feedback.bad{background:var(--danger-soft);color:#7f1d1d;border-left:3px solid var(--danger)}
.feedback.neutral{background:var(--info-soft);color:#1e3a8a;border-left:3px solid var(--info)}
.feedback-title{font-weight:600;margin-bottom:4px;font-size:13px;text-transform:uppercase;letter-spacing:0.04em}

.sim-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.sim-score{font-size:13px;color:var(--muted)}
.sim-score b{color:var(--ink);font-family:var(--mono);font-weight:500}

.justify-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.justify-box h4{font-size:14px;font-weight:600;margin-bottom:6px}
.justify-box p.hint{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.justify-box textarea{min-height:140px;font-size:14px;line-height:1.6}

.report{padding:40px 0 0}
.report-head{text-align:center;padding:48px 32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:24px}
.report-score{font-family:var(--serif);font-size:80px;font-weight:500;line-height:1;color:var(--ink);margin-bottom:8px}
.report-tier{font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);margin-bottom:16px}
.report-summary{max-width:560px;margin:0 auto;color:var(--ink-2);font-size:15px;line-height:1.6}
.report-bars{display:grid;gap:14px;padding:28px 32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:24px}
.report-bar{display:grid;grid-template-columns:180px 1fr 60px;gap:16px;align-items:center;font-size:13px}
.report-bar-label{color:var(--ink-2);font-weight:500}
.report-bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.report-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .8s cubic-bezier(0.2,0.8,0.2,1);width:0}
.report-bar-value{font-family:var(--mono);font-size:13px;font-weight:500;text-align:right;color:var(--ink)}
.report-decisions{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px}
.report-decision{padding:16px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.55}
.report-decision:last-child{border-bottom:0;padding-bottom:0}
.report-decision-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:4px}
.report-decision-tag.good{color:var(--success)}
.report-decision-tag.bad{color:var(--danger)}
.report-decision b{color:var(--ink);font-weight:600}
.report-decision .why{color:var(--ink-2);margin-top:6px;font-size:13.5px;line-height:1.55;font-style:italic;border-left:2px solid var(--border);padding-left:10px}

.loading{padding:80px 32px;text-align:center;color:var(--muted);font-size:14px}
.error-banner{padding:20px 24px;background:var(--danger-soft);color:#7f1d1d;border-radius:var(--radius);margin:20px 0;font-size:14px}

.footer{margin-top:80px;padding:40px 32px;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.footer a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.footer a:hover{color:var(--ink)}

@media print{
  .nav,.breadcrumb,.wizard-nav,.sim-nav,.result-actions,.footer,.btn{display:none!important}
  .view{display:block!important}
  body{background:#fff}
  .dest-body{max-height:none!important}
  .dest-card{break-inside:avoid}
}
@media(max-width:800px){
  .nav{padding:12px 20px;flex-wrap:wrap}
  .brand-tag{display:none}
  .container{padding:0 20px}
  .hero{padding:48px 0 40px}
  .paths,.option-grid,.sim-levels{grid-template-columns:1fr}
  .dest-content{grid-template-columns:1fr;padding:0 20px 20px}
  .dest-meta{grid-template-columns:1fr 1fr}
  .report-bar{grid-template-columns:1fr 60px;gap:8px}
  .report-bar-track{grid-column:1/-1;order:2}
  .result-head{flex-direction:column;align-items:flex-start}
  .hero-stats{gap:24px}
  .scenario,.dest-head,.report-head{padding:20px}
}
</style>
</head>
<body>

async function loadData() {
  try {
    const [products, destinations, pairs, scenarios] = await Promise.all([
      fetch('./data/products.json').then(r => { if (!r.ok) throw new Error('products.json'); return r.json(); }),
      fetch('./data/destinations.json').then(r => { if (!r.ok) throw new Error('destinations.json'); return r.json(); }),

      fetch('./data/scenarios.json').then(r => { if (!r.ok) throw new Error('scenarios.json'); return r.json(); })
    ]);
    state.data.products = products.products;
    state.data.destinations = destinations.destinations;
    state.data.pairs = pairs.pairs;
    state.data.scenarios = scenarios.scenarios;
    state.loaded = true;
  } catch (err) {
    state.error = err.message;
  }
}

/* ═══════════════ HELPERS ═══════════════ */
function getProduct(id) { return state.data.products.find(p => p.id === id); }
function getDestination(id) { return state.data.destinations.find(d => d.id === id); }
function getPair(productId, destinationId) {
  return state.data.pairs.find(p => p.productId === productId && p.destinationId === destinationId);
}
function getPairsForProduct(productId) {
  return state.data.pairs.filter(p => p.productId === productId)
    .map(pair => ({ pair, destination: getDestination(pair.destinationId) }))
    .filter(x => x.destination);
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ═══════════════ ROUTING ═══════════════ */
function router() {
  const app = document.getElementById('app');
  if (state.error) {
    app.innerHTML = `<div class="container"><div class="error-banner"><b>Error cargando datos:</b> ${escapeHTML(state.error)}. Verifica que los archivos JSON existan en <code>public/data/</code>.</div></div>`;
    return;
  }
  if (!state.loaded) {
    app.innerHTML = `<div class="loading">Cargando datos…</div>`;
    return;
  }
  const hash = location.hash || '#/';
  document.querySelectorAll('.nav-link').forEach(l => {
    const target = l.getAttribute('href');
    l.classList.toggle('active', target === hash);
  });
  if (hash === '#/' || hash === '' || hash === '#') renderLanding(app);
  else if (hash === '#/consultor') renderConsultor(app);
  else if (hash === '#/simulador') renderSimulador(app);
  else renderLanding(app);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('hashchange', router);

}

      <div class="breadcrumb">
        <a href="#/">Inicio</a>
        <span class="sep">/</span>
        <a href="#/consultor" onclick="resetConsultor()">Consultor</a>
        <span class="sep">/</span>
        <span class="current">Paso ${state.consultor.step}</span>
      </div>
      <div class="wizard">
        <div class="wizard-head">
          <div class="wizard-step" id="c-step-label">Paso ${state.consultor.step} de 3</div>
          <h2 class="wizard-title" id="c-title"></h2>
          <p class="wizard-sub" id="c-sub"></p>
        </div>
        <div class="progress">
          ${[1,2,3].map(n => `<div class="progress-step ${n < state.consultor.step ? 'done' : n === state.consultor.step ? 'active' : ''}"></div>`).join('')}
        </div>
        <div id="c-body"></div>
        <div class="wizard-nav">
          <button class="btn btn-ghost" onclick="consultorBack()" ${state.consultor.step === 1 ? 'style="visibility:hidden"' : ''}>← Atrás</button>
          <button class="btn btn-primary" onclick="consultorNext()" id="c-next" disabled>Siguiente →</button>
        </div>
      </div>
    </section>
  `;
  renderConsultorStep();
}

function renderConsultorStep() {
  const s = state.consultor.step;
  const body = document.getElementById('c-body');
  const next = document.getElementById('c-next');
  const title = document.getElementById('c-title');
  const sub = document.getElementById('c-sub');

  if (s === 1) {
    title.textContent = '¿Qué producto produces?';
    sub.textContent = 'Elige el producto que quieres exportar. Cada uno tiene mercados, requisitos y dinámicas distintas.';
    body.innerHTML = `
      <div class="option-grid">
        ${state.data.products.map(p => `
          <button class="option-card ${state.consultor.product === p.id ? 'selected' : ''}" onclick="selectConsultorProduct('${p.id}', this)">
            <div class="option-check"></div>
            <div class="option-icon">${p.icon}</div>
            <div class="option-title">${escapeHTML(p.name)}</div>
            <div class="option-desc">${escapeHTML(p.shortDescription)}<br><span style="font-family:var(--mono);font-size:11px;color:var(--muted-2)">HS ${p.hsCode}</span></div>
          </button>
        `).join('')}
      </div>
    `;
    next.disabled = !state.consultor.product;
  } else if (s === 2) {
    const p = getProduct(state.consultor.product);
    title.textContent = '¿Cuál es tu capacidad de producción?';
    sub.textContent = `Esto nos da contexto para la recomendación de ${p.name.toLowerCase()}.`;
    body.innerHTML = `
      <div class="field-group">
        <label class="field-label">Volumen aproximado por año</label>
        <select onchange="selectConsultorVolume(this.value)">
          <option value="">Selecciona un rango…</option>
          <option value="small" ${state.consultor.volume === 'small' ? 'selected' : ''}>Menos de 10 toneladas / año</option>
          <option value="medium" ${state.consultor.volume === 'medium' ? 'selected' : ''}>Entre 10 y 50 toneladas / año</option>
          <option value="large" ${state.consultor.volume === 'large' ? 'selected' : ''}>Entre 50 y 200 toneladas / año</option>
          <option value="xl" ${state.consultor.volume === 'xl' ? 'selected' : ''}>Más de 200 toneladas / año</option>
        </select>
        <p class="field-hint">Volumen aproximado de producto terminado listo para exportación, en toneladas métricas por año.</p>
      </div>
    `;
    next.disabled = !state.consultor.volume;
  } else if (s === 3) {
    title.textContent = '¿Qué te interesa saber?';
    sub.textContent = 'Enfocamos la recomendación en lo que necesitas para tomar la siguiente decisión.';
    const opts = [
      { id: 'destinos', icon: '🎯', title: 'A dónde exportar', desc: 'Los destinos más viables según tu producto y capacidad, con contexto de demanda.' },
      { id: 'requisitos', icon: '📋', title: 'Qué requisitos cumplir', desc: 'Checklist sanitario, de etiquetado, certificaciones y aranceles por destino.' },
      { id: 'todo', icon: '📊', title: 'El panorama completo', desc: 'Destinos, requisitos, contactos y links oficiales para empezar a operar.' }
    ];
    body.innerHTML = `
      <div class="option-grid">
        ${opts.map(o => `
          <button class="option-card ${state.consultor.objective === o.id ? 'selected' : ''}" onclick="selectConsultorObjective('${o.id}', this)">
            <div class="option-check"></div>
            <div class="option-icon">${o.icon}</div>
            <div class="option-title">${o.title}</div>
            <div class="option-desc">${o.desc}</div>
          </button>
        `).join('')}
      </div>
    `;
    next.disabled = !state.consultor.objective;
  }
  next.textContent = s === 3 ? 'Ver recomendación →' : 'Siguiente →';
}

function selectConsultorProduct(id, el) {
  state.consultor.product = id;
  document.querySelectorAll('#c-body .option-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('c-next').disabled = false;
}
function selectConsultorVolume(v) {
  state.consultor.volume = v;
  document.getElementById('c-next').disabled = !v;
}
function selectConsultorObjective(o, el) {
  state.consultor.objective = o;
  document.querySelectorAll('#c-body .option-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('c-next').disabled = false;
}
function consultorNext() {
  if (state.consultor.step < 3) {
    state.consultor.step++;
    renderConsultor(document.getElementById('app'));
  } else {
    state.consultor.step = 4;
    renderConsultorResult(document.getElementById('app'));
  }
}

/* ═══════════════ SIMULADOR ═══════════════ */
function renderSimulador(app) {
  if (!state.sim.level) return renderSimLevels(app);
  if (state.sim.level === 'novato') return renderNovato(app);
  if (state.sim.level === 'avanzado') return renderAvanzado(app);
}

function renderSimLevels(app) {
  app.innerHTML = `
    <section class="container">
      <div class="breadcrumb">
        <a href="#/">Inicio</a>
        <span class="sep">/</span>
        <span class="current">Simulador</span>
      </div>
      <div class="wizard-head" style="padding-top:40px">
        <div class="wizard-step">Simulador de decisiones</div>
        <h2 class="wizard-title">Elige tu nivel de experiencia</h2>
        <p class="wizard-sub">Ambos niveles usan los mismos casos reales. Cambia el nivel de acompañamiento y la forma en que se evalúa tu criterio.</p>
      </div>
      <div class="sim-levels">
        <div class="level-card" onclick="startSim('novato')">
          <div class="level-badge">● Novato</div>
          <div class="level-title">No tengo experiencia en comercio exterior</div>
          <div class="level-desc">Te guío paso a paso. Cada decisión viene con contexto, opciones explicadas y feedback inmediato.</div>
          <div class="level-meta"><span>📚 6 decisiones</span><span>👨‍🏫 Coach</span><span>⏱ 10–15 min</span></div>
        </div>
        <div class="level-card" onclick="startSim('avanzado')">
          <div class="level-badge">● Avanzado</div>
          <div class="level-title">Ya tengo base en comercio exterior</div>
          <div class="level-desc">Briefing profesional sin pistas. Tú decides y argumentas por escrito. Feedback diferido con rúbrica.</div>
          <div class="level-meta"><span>📚 4 decisiones</span><span>✍️ Argumentación</span><span>⏱ 20–30 min</span></div>
        </div>
      </div>
    </section>
  `;
}

function startSim(level) {
  state.sim = { level, step: 0, product: null, destination: null, entryMode: null, decisions: [], score: 0 };
  renderSimulador(document.getElementById('app'));
}

function stepPill(current, total) {
  let html = '<div class="step-pill">';
  for (let i = 0; i < total; i++) {
    html += `<div class="sp ${i < current ? 'done' : i === current ? 'current' : ''}"></div>`;
  }
  return html + '</div>';
}

/* ── Novato ── */
function renderNovato(app) {
  const s = state.sim.step;
  const total = 6;
  let content = '';

  if (s === 0) {
    content = `
      <div class="coach">
        <div class="coach-icon">🧑‍🏫</div>
        <div class="coach-text"><b>Antes de empezar.</b> Exportar no es solo vender afuera: es cumplir requisitos, calcular costos y encontrar el comprador correcto. Te acompaño en cada paso.</div>
      </div>
      <div class="option-grid">
        ${state.data.products.map(p => `
          <button class="option-card ${state.sim.product === p.id ? 'selected' : ''}" onclick="simSelect('product', '${p.id}', this)">
            <div class="option-check"></div>
            <div class="option-icon">${p.icon}</div>
            <div class="option-title">${escapeHTML(p.name)}</div>
            <div class="option-desc">${escapeHTML(p.shortDescription)}</div>
          </button>
        `).join('')}
      </div>
    `;
  } else if (s === 1) {
    const p = getProduct(state.sim.product);
    content = `
      <div class="coach">
        <div class="coach-icon">🧑‍🏫</div>
        <div class="coach-text"><b>${p.icon} ${escapeHTML(p.name)}.</b> ${escapeHTML(p.context)}</div>
      </div>
      <div class="option-grid" style="grid-template-columns:repeat(2,1fr)">
        ${getPairsForProduct(state.sim.product).map(({ pair, destination }) => `
          <button class="option-card ${state.sim.destination === destination.id ? 'selected' : ''}" onclick="simSelect('destination', '${destination.id}', this)">
            <div class="option-check"></div>
            <div class="option-icon">${destination.flag}</div>
            <div class="option-title">${escapeHTML(destination.name)}</div>
            <div class="option-desc">${escapeHTML(pair.summary)}</div>
          </button>
        `).join('')}
      </div>
    `;
  } else if (s === 2) {
    content = `
      <div class="coach">
        <div class="coach-icon">🧑‍🏫</div>
        <div class="coach-text"><b>Cómo vas a vender.</b> Exportación directa = tú vendes al comprador. Alianza = compartes riesgo con un socio local. IED = abres operación propia (raro para primerizos).</div>
      </div>
      <div class="decision-list">
        ${[
          { id: 'directa', title: 'Exportación directa', desc: 'Vendes tú al comprador internacional. Mayor margen, mayor riesgo.' },
          { id: 'alianza', title: 'Alianza estratégica con socio local', desc: 'Un distribuidor en destino asume logística y relación comercial. Menor margen, menor riesgo.' },
          { id: 'ied', title: 'Inversión Extranjera Directa (IED)', desc: 'Operación propia en el exterior. Requiere capital y conocimiento profundo. Rara vez primera opción.' }
        ].map(o => `
          <button class="decision ${state.sim.entryMode === o.id ? 'selected' : ''}" onclick="simSelect('entryMode', '${o.id}', this)">
            <div class="decision-radio"></div>
            <div class="decision-text">
              <div class="decision-title">${o.title}</div>
              <div class="decision-desc">${o.desc}</div>
            </div>
          </button>
        `).join('')}
      </div>
    `;
  } else {
    const scenario = state.data.scenarios[s - 3];
    const decision = state.sim.decisions[s - 3];
    if (!scenario) { state.sim.step = 5; return renderNovato(app); }
    content = `
      <div class="scenario">
        <div class="scenario-tag">${escapeHTML(scenario.tag)}</div>
        <h2>${escapeHTML(scenario.title)}</h2>
        <p>${escapeHTML(scenario.text)}</p>
        <div class="scenario-context">${escapeHTML(scenario.context)}</div>
        <div class="coach">
          <div class="coach-icon">🧑‍🏫</div>
          <div class="coach-text"><b>Piensa antes de elegir.</b> No hay una única respuesta correcta, pero algunas te protegen mejor que otras. Lee las tres opciones y elige.</div>
        </div>
        <div class="decision-list">
          ${scenario.options.map((o, i) => `
            <button class="decision ${decision && decision.choice === i ? 'selected' : ''}" onclick="novatoChoose(${s - 3}, ${i})" ${decision ? 'disabled' : ''}>
              <div class="decision-radio"></div>
              <div class="decision-text">
                <div class="decision-title">${escapeHTML(o.label)}</div>
              </div>
            </button>
          `).join('')}
        </div>

          <div class="feedback ${decision.correct ? 'good' : 'neutral'}">
            <div class="feedback-title">${decision.correct ? '✓ Respuesta acertada' : '◐ Respuesta no óptima'}</div>
            ${escapeHTML(decision.feedback)}
          </div>
        ` : ''}
      </div>
    `;
  }

  const canNext = (s === 0 && state.sim.product) || (s === 1 && state.sim.destination) || (s === 2 && state.sim.entryMode) || (s >= 3 && state.sim.decisions[s - 3]);

  app.innerHTML = `
    <section class="container">
      <div class="breadcrumb">
        <a href="#/">Inicio</a><span class="sep">/</span>
        <a href="#/simulador" onclick="resetSim()">Simulador</a><span class="sep">/</span>
        <span class="current">Novato · Paso ${s + 1} de ${total}</span>
      </div>
      <div class="sim-stage">
        <div class="sim-header">
          <div class="sim-badge ${s >= 3 ? 'live' : ''}">● Modo novato${s >= 3 ? ' · Señal ' + (s - 2) + ' de 3' : ''}</div>
        </div>
        ${stepPill(s, total)}
        ${content}
        <div class="sim-nav">
          <div class="sim-score">Puntaje de criterio: <b>${state.sim.score}</b></div>
          <div style="display:flex;gap:8px">
            ${s > 0 ? `<button class="btn btn-secondary" onclick="simBack()">← Atrás</button>` : ''}
            <button class="btn btn-primary" onclick="simNext()" ${!canNext ? 'disabled' : ''}>
              ${s === total - 1 ? 'Ver resultado →' : s === 2 ? 'Recibir primer escenario →' : 'Continuar →'}
            </button>
          </div>
        </div>
      </div>
    </section>
  `;
}

function simSelect(field, value, el) {
  state.sim[field] = value;
  const parent = el.parentElement;
  parent.querySelectorAll('.option-card, .decision').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  renderNovato(document.getElementById('app'));
}
function simBack() {
  if (state.sim.step > 0) { state.sim.step--; renderNovato(document.getElementById('app')); }
}
function simNext() {
  if (state.sim.step < 5) { state.sim.step++; renderNovato(document.getElementById('app')); }
  else finishNovato(document.getElementById('app'));
}
function novatoChoose(idx, choice) {
  if (state.sim.decisions[idx]) return;
  const scenario = state.data.scenarios[idx];
  const opt = scenario.options[choice];
  state.sim.decisions[idx] = { choice, correct: opt.correct, feedback: opt.feedback, scenario: scenario.title, label: opt.label };
  if (opt.correct) state.sim.score += 20; else state.sim.score += 5;
  renderNovato(document.getElementById('app'));
}

function finishNovato(app) {
  const correct = state.sim.decisions.filter(d => d.correct).length;
  const pct = Math.round((state.sim.score / 60) * 100);
  const tier = pct >= 80 ? { label: 'Criterio sólido', desc: 'Tus decisiones fueron en su mayoría acertadas. Estás listo para el modo avanzado.' }
             : pct >= 50 ? { label: 'Criterio en formación', desc: 'Varias decisiones acertadas, otras no. Revisa el feedback y repite.' }
             : { label: 'Comenzando el camino', desc: 'Estás empezando. Repite el simulador y revisa cada feedback con calma.' };

  app.innerHTML = `
    <section class="container">
      <div class="breadcrumb">
        <a href="#/">Inicio</a><span class="sep">/</span>
        <a href="#/simulador" onclick="resetSim()">Simulador</a><span class="sep">/</span>
        <span class="current">Resultado novato</span>
      </div>
      <div class="report">
        <div class="report-head">
          <div class="report-score">${pct}</div>
          <div class="report-tier">${tier.label}</div>
          <p class="report-summary">${tier.desc}</p>
          <div style="margin-top:16px;font-family:var(--mono);font-size:13px;color:var(--muted)">${correct} de 3 decisiones acertadas · ${state.sim.score} puntos</div>
          <div style="margin-top:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="startSim('novato')">← Repetir</button>
            <button class="btn btn-secondary btn-sm" onclick="resetSim(); renderSimulador(document.getElementById('app'))">Volver a niveles</button>
            <button class="btn btn-primary btn-sm" onclick="startSim('avanzado')">Probar modo avanzado →</button>
          </div>
        </div>
        <div class="report-decisions">
          <h3 style="font-size:18px;margin-bottom:16px;font-weight:600">Tus decisiones</h3>
          ${state.sim.decisions.map((d, i) => `
            <div class="report-decision">
              <div class="report-decision-tag ${d.correct ? 'good' : 'bad'}">Escenario ${i + 1} · ${d.correct ? 'Acertada' : 'No óptima'}</div>
              <b>${escapeHTML(d.scenario)}</b>
              <div style="font-size:13px;color:var(--muted);margin-top:4px">Elegiste: ${escapeHTML(d.label)}</div>
              <div class="why">${escapeHTML(d.feedback)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </section>
  `;
}

/* ── Avanzado ── */
function renderAvanzado(app) {
  const s = state.sim.step;
  if (s === 0) return renderAvanzadoConfig(app);
  if (s >= 1 && s <= 4) return renderAvanzadoScenario(app, s - 1);
  if (s === 5) return renderAvanzadoReport(app);
}

  app.innerHTML = `

      <div class="breadcrumb">

function advSet(field, value) {
  state.sim[field] = value;
  if (field === 'product') state.sim.destination = null;
  renderAvanzadoConfig(document.getElementById('app'));
}
function advStart() {
  if (!state.sim.product || !state.sim.destination || !state.sim.entryMode) return;
  state.sim.step = 1;
  renderAvanzadoScenario(document.getElementById('app'), 0);
}

function renderAvanzadoScenario(app, idx) {
  const scenario = state.data.scenarios[idx];
  const decision = state.sim.decisions[idx];
  const product = getProduct(state.sim.product);
  const destination = getDestination(state.sim.destination);

  app.innerHTML = `
    <section class="container">
      <div class="breadcrumb">
        <a href="#/">Inicio</a><span class="sep">/</span>

        <div class="sim-header">
          <div class="sim-badge live">● Escenario ${idx + 1} de 4 · ${escapeHTML(scenario.tag)}</div>
        </div>
        ${stepPill(idx + 1, 5)}
        <div class="scenario">
          <div class="scenario-tag">${escapeHTML(scenario.tag)}</div>

            </div>
          ` : `
            <div class="feedback neutral">
              <div class="feedback-title">✓ Argumentación registrada</div>
              El feedback llegará al final, con la rúbrica completa. La evaluación diferida es intencional: construyes tu criterio sin correcciones inmediatas.
            </div>
          `}
        </div>
        <div class="sim-nav">
          <div class="sim-score">Decisiones registradas: <b>${state.sim.decisions.filter(Boolean).length} / 4</b></div>
          ${!decision ? `
            <button class="btn btn-primary" id="adv-submit" onclick="advSubmit(${idx})" disabled>Confirmar argumentación →</button>

            <button class="btn btn-primary" onclick="advNext()">${idx === 3 ? 'Ver evaluación final →' : 'Siguiente escenario →'}</button>

function advCheckReady() {
  const ta = document.getElementById('adv-textarea');
  const btn = document.getElementById('adv-submit');
  if (!ta || !btn) return;
  const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
  btn.disabled = words < 30;
}
function advSubmit(idx) {
  const ta = document.getElementById('adv-textarea');
  const why = ta.value.trim();
  const scenario = state.data.scenarios[idx];
  const evaluation = evaluateArgument(why, scenario);
  state.sim.decisions[idx] = {
    scenario: scenario.title,
    tag: scenario.tag,
    why,
    score: evaluation.score,
    notes: evaluation.notes
  };
  state.sim.score += evaluation.score;
  renderAvanzadoScenario(document.getElementById('app'), idx);
}
function advNext() {
  state.sim.step++;
  renderAvanzado(document.getElementById('app'));
}

function evaluateArgument(text, scenario) {
  const lower = text.toLowerCase();
  const words = text.trim().split(/\s+/).filter(Boolean);
  const wc = words.length;
  const unique = new Set(words.map(w => w.toLowerCase().replace(/[^a-záéíóúñ]/g, ''))).size;
  const ttr = unique / Math.max(1, wc);
  const stuffed = wc >= 20 && ttr < 0.55;
  let score = 0;
  const notes = [];

  if (wc >= 60) { score += 15; notes.push('Extensión adecuada para una argumentación profesional'); }
  else if (wc >= 40) { score += 10; notes.push('Extensión aceptable'); }
  else if (wc >= 30) { score += 5; notes.push('Extensión mínima'); }
  else { score -= 5; notes.push('Argumentación demasiado breve'); }

  const connectors = ['porque','ya que','dado que','debido a','por lo tanto','en consecuencia','esto permite','sin embargo','con el fin'];
  const hits = connectors.filter(c => lower.includes(c)).length;
  if (hits >= 2) { score += 15; notes.push('Usa conectores causales en más de una ocasión'); }
  else if (hits === 1) { score += 8; notes.push('Usa al menos un conector causal'); }
  else { notes.push('No hay conectores causales: falta explicar el "por qué"'); }

  const scenarioWords = scenario.title.toLowerCase().split(/\s+/);
  const scenarioHits = scenarioWords.filter(w => w.length > 4 && lower.includes(w)).length;
  if (scenarioHits >= 1) { score += 10; notes.push('Conecta con el escenario específico'); }
  else { notes.push('No referencia el escenario: parece genérica'); }

  const product = getProduct(state.sim.product);
  const destination = getDestination(state.sim.destination);
  if (product && lower.includes(product.name.toLowerCase())) { score += 5; notes.push('Menciona el producto'); }
  if (destination && lower.includes(destination.name.toLowerCase())) { score += 5; notes.push('Menciona el destino'); }

  if (stuffed) { score = Math.floor(score / 2); notes.push('Se detecta repetición sin suma de ideas nuevas'); }

  return { score: Math.max(0, Math.min(100, score + 30)), notes };
}

function renderAvanzadoReport(app) {
  const total = state.sim.decisions.reduce((a, d) => a + (d ? d.score : 0), 0);
  const count = state.sim.decisions.filter(Boolean).length;
  const avg = count ? Math.round(total / count) : 0;
  const tier = avg >= 75 ? { label: 'Estratega internacional', desc: 'Tus argumentos son claros, causales y específicos. Estás listo para tomar decisiones de exportación reales.' }
             : avg >= 55 ? { label: 'Analista en desarrollo', desc: 'Tienes criterio, pero hay espacio para profundizar en el "por qué" de cada decisión.' }
             : { label: 'Aprendiz estratégico', desc: 'Tus argumentaciones son breves o genéricas. Practica la estructura: decisión → porque → consecuencia esperada.' };

  app.innerHTML = `
    <section class="container">
      <div class="breadcrumb">
        <a href="#/">Inicio</a><span class="sep">/</span>
        <a href="#/simulador" onclick="resetSim()">Simulador</a><span class="sep">/</span>
        <span class="current">Evaluación final</span>
      </div>
      <div class="report">
        <div class="report-head">
          <div class="report-score">${avg}</div>
          <div class="report-tier">${tier.label}</div>
          <p class="report-summary">${tier.desc}</p>
          <div style="margin-top:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="startSim('avanzado')">← Repetir</button>
            <button class="btn btn-secondary btn-sm" onclick="resetSim(); renderSimulador(document.getElementById('app'))">Volver a niveles</button>
            <button class="btn btn-primary btn-sm" onclick="window.print()">Imprimir</button>
          </div>
        </div>
        <div class="report-bars">
          ${state.sim.decisions.map((d, i) => `
            <div class="report-bar">
              <div class="report-bar-label">Escenario ${i + 1} · ${escapeHTML(d.tag)}</div>
              <div class="report-bar-track"><div class="report-bar-fill" data-pct="${d.score}" style="width:0"></div></div>
              <div class="report-bar-value">${d.score}/100</div>
            </div>
          `).join('')}
        </div>
        <div class="report-decisions">
          <h3 style="font-size:18px;margin-bottom:16px;font-weight:600">Análisis detallado</h3>
          ${state.sim.decisions.map((d, i) => `
            <div class="report-decision">
              <div class="report-decision-tag ${d.score >= 60 ? 'good' : 'bad'}">Escenario ${i + 1} · ${escapeHTML(d.tag)} · ${d.score}/100</div>
              <b>${escapeHTML(d.scenario)}</b>
              <div class="why">"${escapeHTML(d.why)}"</div>
              <div style="margin-top:8px;font-size:13px;color:var(--muted)">${d.notes.map(n => `<div>· ${escapeHTML(n)}</div>`).join('')}</div>
            </div>
          `).join('')}
        </div>
        <div class="disclaimer" style="margin-top:24px">
          <b>Sobre esta evaluación.</b> La rúbrica se basa en claridad, causalidad, referencia específica al escenario y coherencia con el contexto. No es una verdad absoluta: es un punto de partida para la conversación.
        </div>
      </div>
    </section>
  `;
  setTimeout(() => {
    document.querySelectorAll('.report-bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 100);
}

function resetSim() {
  state.sim = { level: null, step: 0, product: null, destination: null, entryMode: null, decisions: [], score: 0 };
}

/* ═══════════════ INIT ═══════════════ */
(async () => {
  await loadData();
  router();
})();
</script>
