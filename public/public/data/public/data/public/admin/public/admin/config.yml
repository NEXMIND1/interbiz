backend:
  name: github
  repo: NEXMIND1/interbiz        # ← CAMBIA ESTO
  branch: main
  # Para que funcione el login con GitHub, necesitas configurar OAuth.
  # Guía: https://decapcms.org/docs/github-backend/
  # Alternativa gratis rápida: https://github.com/vencax/netlify-cms-github-oauth-provider

media_folder: "public/images"
public_folder: "/images"

locale: es

collections:
  - name: "products"
    label: "Productos"
    files:
      - file: "public/data/products.json"
        label: "Lista de productos"
        name: "products"
        fields:
          - name: "products"
            label: "Productos"
            widget: "list"
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "name", label: "Nombre", widget: "string" }
              - { name: "icon", label: "Emoji", widget: "string" }
              - { name: "hsCode", label: "Código HS", widget: "string" }
              - { name: "shortDescription", label: "Descripción corta", widget: "string" }
              - { name: "context", label: "Contexto", widget: "text" }
              - { name: "exportValueUsd", label: "Valor exportado (USD)", widget: "number", value_type: "int" }
              - { name: "exportValueYear", label: "Año", widget: "number", value_type: "int" }
              - { name: "growthRate", label: "Crecimiento", widget: "select", options: ["alto", "medio", "bajo", "estable"] }
              - { name: "competitors", label: "Competidores", widget: "list", field: { name: "country", widget: "string" } }
              - { name: "destinationIds", label: "IDs de destinos", widget: "list", field: { name: "id", widget: "string" } }

  - name: "destinations"
    label: "Destinos"
    files:
      - file: "public/data/destinations.json"
        label: "Lista de destinos"
        name: "destinations"
        fields:
          - name: "destinations"
            label: "Destinos"
            widget: "list"
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "name", label: "Nombre", widget: "string" }
              - { name: "flag", label: "Bandera (emoji)", widget: "string" }
              - { name: "isoCode", label: "Código ISO", widget: "string" }
              - { name: "trademapCode", label: "Código Trade Map", widget: "string" }
              - { name: "region", label: "Región", widget: "select", options: ["americas", "europa", "asia", "africa", "oceania"] }
              - { name: "agreement", label: "Acuerdo comercial", widget: "string" }
              - { name: "agreementInForce", label: "Acuerdo vigente", widget: "boolean", default: true }

  - name: "pairs"
    label: "Producto × Destino"
    files:
      - file: "public/data/pairs.json"
        label: "Pares curados"
        name: "pairs"
        fields:
          - name: "pairs"
            label: "Pares"
            widget: "list"
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "productId", label: "ID Producto", widget: "string" }
              - { name: "destinationId", label: "ID Destino", widget: "string" }
              - { name: "score", label: "Score (0-100)", widget: "number", value_type: "int", min: 0, max: 100 }
              - { name: "summary", label: "Resumen", widget: "string" }
              - { name: "demand", label: "Demanda", widget: "text" }
              - { name: "why", label: "Por qué", widget: "text" }
              - { name: "requirements", label: "Requisitos", widget: "object", fields: [
                  { name: "sanitary", label: "Sanitario", widget: "text" },
                  { name: "labeling", label: "Etiquetado", widget: "text" },
                  { name: "certifications", label: "Certificaciones", widget: "list", field: { name: "cert", widget: "string" } },
                  { name: "tariff", label: "Arancel", widget: "string" },
                  { name: "tariffRate", label: "Tasa arancelaria", widget: "number", value_type: "float" }
                ] }
              - { name: "entryModes", label: "Modos de entrada", widget: "list", field: { name: "mode", widget: "string" } }
              - { name: "volume", label: "Volumen típico", widget: "text" }
              - { name: "contacts", label: "Contactos", widget: "list", fields: [
                  { name: "name", label: "Nombre", widget: "string" },
                  { name: "url", label: "URL", widget: "string" }
                ] }
              - { name: "tradeMapUrl", label: "URL Trade Map", widget: "string" }
              - { name: "lastReviewedAt", label: "Última revisión", widget: "datetime" }
              - { name: "reviewedBy", label: "Revisado por", widget: "string" }

  - name: "scenarios"
    label: "Escenarios del simulador"
    files:
      - file: "public/data/scenarios.json"
        label: "Escenarios"
        name: "scenarios"
        fields:
          - name: "scenarios"
            label: "Escenarios"
            widget: "list"
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "tag", label: "Etiqueta", widget: "string" }
              - { name: "title", label: "Título", widget: "string" }
              - { name: "text", label: "Texto del escenario", widget: "text" }
              - { name: "context", label: "Contexto", widget: "text" }
              - name: "options"
                label: "Opciones"
                widget: "list"
                fields:
                  - { name: "label", label: "Etiqueta", widget: "string" }
                  - { name: "correct", label: "¿Es correcta?", widget: "boolean" }
                  - { name: "feedback", label: "Feedback", widget: "text" }
